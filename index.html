  <meta charset="UTF-8">

  <title>Mauricio Hernandez</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #ffffff;
    }
    main {
      text-align: center;
      padding: 0 16px;
    }
    .foto {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 0 32px;
    }
    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 999px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
    }
    .whatsapp {
      background: #25d366;
    }
    .musica {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
  </style>

  <audio id="cancion" src="cancion.mp3" loop></audio>
  <button class="musica" id="musica" title="Música">🔇</button>

  <script>
    const cancion = document.getElementById('cancion');
    const boton = document.getElementById('musica');

    cancion.addEventListener('play', () => boton.textContent = '🔊');
    cancion.addEventListener('pause', () => boton.textContent = '🔇');

    // Los navegadores no dejan sonar música sin que el visitante interactúe,
    // así que arranca con el primer clic o toque en la página.
    function iniciar(e) {
      if (e.target.closest('#musica')) return;
      cancion.play().catch(() => {});
      document.removeEventListener('click', iniciar);
    }
    document.addEventListener('click', iniciar);

    boton.addEventListener('click', () => {
      document.removeEventListener('click', iniciar);
      if (cancion.paused) {
        cancion.play().catch(() => {});
      } else {
        cancion.pause();
      }
    });
  </script>
